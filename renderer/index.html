<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:"
    />
    <title>Browser MCP</title>
    <style>
      :root {
        --strip: #dee1e6;
        --strip-hover: rgba(255, 255, 255, 0.55);
        --chrome: #ffffff;
        --text: #1f1f1f;
        --text-2: #5f6368;
        --omnibox: #f0f2f4;
        --omnibox-hover: #e4e7ea;
        --hover: #eef0f1;
        --accent: #0f6cbd;
        --border: #c6cacf;
        --hairline: #dadde1;
        --busy-bg: #fff4e5;
        --busy-fg: #8a5300;
        --menu-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
        --panel-w: 340px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --strip: #1b1b1b;
          --strip-hover: rgba(255, 255, 255, 0.08);
          --chrome: #2d2d2d;
          --text: #e8e8e8;
          --text-2: #a6a6a6;
          --omnibox: #3b3b3b;
          --omnibox-hover: #454545;
          --hover: rgba(255, 255, 255, 0.09);
          --accent: #62abfb;
          --border: #4a4a4a;
          --hairline: #404040;
          --busy-bg: #3d2f14;
          --busy-fg: #f2c14e;
          --menu-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
        }
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font: 12.5px/1.4 "Segoe UI", -apple-system, "Microsoft YaHei", sans-serif;
        color: var(--text);
        background: var(--chrome);
        user-select: none;
      }
      svg { display: block; }
      button { font: inherit; }

      /* ---------- 标签栏（标题栏区域，可拖动窗口） ---------- */
      #tabbar {
        height: 40px;
        display: flex;
        align-items: flex-end;
        gap: 4px;
        padding: 4px 150px 0 8px; /* 右侧留给 titleBarOverlay 的窗口按钮 */
        background: var(--strip);
        -webkit-app-region: drag;
      }
      #tabbar > * { -webkit-app-region: no-drag; }
      #tabs {
        display: flex;
        align-items: flex-end;
        flex: 0 1 auto;
        min-width: 0;
        overflow: hidden;
      }
      .tab {
        position: relative;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 33px;
        flex: 0 1 200px;
        min-width: 48px;
        padding: 0 6px 0 10px;
        border-radius: 8px 8px 0 0;
        color: var(--text-2);
        cursor: default;
        white-space: nowrap;
      }
      .tab:not(.active):not(:first-child)::before {
        content: "";
        position: absolute;
        left: -0.5px;
        top: 8px;
        bottom: 8px;
        width: 1px;
        background: var(--border);
      }
      .tab:hover::before,
      .tab:hover + .tab::before,
      .tab.active::before,
      .tab.active + .tab::before { display: none; }
      .tab:not(.active):hover { background: var(--strip-hover); }
      .tab.active { background: var(--chrome); color: var(--text); }
      /* ---------- tab group（Edge 风格） ---------- */
      /* 组员 tab 底缘挂一条组色；active 成员同样保留（Edge 同款标识）。 */
      .tab.gm { border-bottom: 2px solid var(--gc, transparent); }
      .tgroup {
        display: flex;
        align-items: center;
        gap: 5px;
        height: 24px;
        margin: 0 2px 5px;
        padding: 0 9px 0 6px;
        border-radius: 12px;
        color: var(--gc, var(--text-2));
        background: color-mix(in srgb, var(--gc, #888) 18%, transparent);
        cursor: default;
        white-space: nowrap;
        font-size: 11.5px;
        font-weight: 600;
      }
      .tgroup:hover { background: color-mix(in srgb, var(--gc, #888) 28%, transparent); }
      .tgroup .gbar {
        width: 4px;
        height: 14px;
        border-radius: 2px;
        background: var(--gc, #888);
        flex: 0 0 4px;
      }
      .tgroup .glabel {
        max-width: 140px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tgroup.collapsed { padding-right: 10px; }
      .tab .favicon {
        width: 16px;
        height: 16px;
        flex: 0 0 16px;
        display: grid;
        place-items: center;
        color: var(--text-2);
      }
      .tab .favicon img { width: 16px; height: 16px; }
      .tab .title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tab .close {
        width: 20px;
        height: 20px;
        flex: 0 0 20px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: none;
        color: inherit;
        cursor: pointer;
        visibility: hidden;
      }
      .tab:hover .close,
      .tab.active .close { visibility: visible; }
      .tab .close:hover { background: rgba(128, 128, 128, 0.28); }
      .spinner {
        width: 13px;
        height: 13px;
        border: 2px solid var(--border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #newTab {
        width: 28px;
        height: 28px;
        margin-bottom: 3px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: none;
        color: var(--text);
        cursor: pointer;
      }
      #newTab:hover { background: var(--strip-hover); }

      /* ---------- 导航栏 ---------- */
      #navbar {
        height: 48px;
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 0 10px;
        background: var(--chrome);
        position: relative;
      }
      .navbtn {
        width: 32px;
        height: 32px;
        flex: 0 0 32px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: none;
        color: var(--text);
        cursor: pointer;
      }
      .navbtn:hover:not(:disabled) { background: var(--hover); }
      .navbtn:disabled { color: var(--text-2); opacity: 0.4; cursor: default; }
      .navbtn.on { color: var(--accent); }
      #omnibox {
        flex: 1;
        min-width: 100px;
        height: 34px;
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 8px;
        padding: 0 8px 0 12px;
        border-radius: 17px;
        background: var(--omnibox);
      }
      #omnibox:hover { background: var(--omnibox-hover); }
      #omnibox:focus-within {
        background: var(--omnibox);
        box-shadow: 0 0 0 1.5px var(--accent);
      }
      #secIcon { flex: 0 0 16px; display: grid; place-items: center; color: var(--text-2); }
      #secIcon.warn { color: #b06000; }
      #address {
        flex: 1;
        min-width: 0;
        height: 100%;
        border: 0;
        outline: none;
        background: none;
        color: var(--text);
        font: inherit;
      }
      #address::placeholder { color: var(--text-2); }
      #star {
        width: 26px;
        height: 26px;
        flex: 0 0 26px;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: none;
        color: var(--text-2);
        cursor: pointer;
      }
      #star:hover:not(:disabled) { background: rgba(128, 128, 128, 0.18); }
      #star:disabled { opacity: 0.35; cursor: default; }
      #star.on { color: var(--accent); }
      #busy {
        display: none;
        align-items: center;
        gap: 6px;
        flex: 0 0 auto;
        padding: 4px 10px;
        border-radius: 12px;
        background: var(--busy-bg);
        color: var(--busy-fg);
        font-size: 12px;
      }
      #busy.on { display: flex; }
      #busy .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: currentColor;
        animation: blink 1s infinite;
      }
      @keyframes blink { 50% { opacity: 0.3; } }

      /* ---------- 侧面板（历史 / 收藏夹 / 菜单） ----------
         停靠在右侧而非浮层：页面是独立 WebContentsView 原生层，
         renderer 画在 chrome 外的内容会被它遮住，所以面板占位、页面让宽。 */
      #panel {
        position: fixed;
        right: 0;
        bottom: 0;
        width: var(--panel-w);
        display: flex;
        flex-direction: column;
        background: var(--chrome);
        border-left: 1px solid var(--hairline);
        z-index: 20;
      }
      #panel[hidden] { display: none; }
      #panelHead {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 8px 8px 6px 14px;
        border-bottom: 1px solid var(--hairline);
      }
      #panelTitle { flex: 1; font-weight: 600; font-size: 13px; }
      #panelBody { flex: 1; overflow-y: auto; padding: 6px; }
      #panelSearch {
        width: calc(100% - 12px);
        margin: 6px;
        height: 30px;
        padding: 0 10px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--omnibox);
        color: var(--text);
        font: inherit;
        outline: none;
      }
      #panelSearch:focus { border-color: var(--accent); }
      .pitem {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 6px;
        cursor: default;
        min-height: 40px;
      }
      .pitem:hover { background: var(--hover); }
      .pitem img, .pitem .favicon { width: 16px; height: 16px; flex: 0 0 16px; color: var(--text-2); }
      .pitem .meta { flex: 1; min-width: 0; }
      .pitem .t {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .pitem .u {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text-2);
        font-size: 11px;
      }
      .pitem .x {
        width: 22px;
        height: 22px;
        flex: 0 0 22px;
        display: none;
        place-items: center;
        border: 0;
        border-radius: 50%;
        background: none;
        color: var(--text-2);
        cursor: pointer;
      }
      .pitem:hover .x { display: grid; }
      .pitem .x:hover { background: rgba(128, 128, 128, 0.3); }
      .phead {
        padding: 10px 8px 4px;
        color: var(--text-2);
        font-size: 11px;
        font-weight: 600;
      }
      .pempty { padding: 24px 12px; color: var(--text-2); text-align: center; }
      .paction {
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 8px 10px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--text);
        cursor: pointer;
        text-align: left;
      }
      .paction:hover { background: var(--hover); }
      .paction .kbd, .paction .check { color: var(--text-2); font-size: 11px; }
      .psep { height: 1px; margin: 6px 4px; background: var(--hairline); }
    </style>
  </head>
  <body>
    <header id="tabbar">
      <div id="tabs"></div>
      <button id="newTab" title="新建标签页 (Ctrl+T)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 5v14M5 12h14" />
        </svg>
      </button>
    </header>
    <nav id="navbar">
      <button id="back" class="navbtn" title="后退 (Alt+←)" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7" />
        </svg>
      </button>
      <button id="fwd" class="navbtn" title="前进 (Alt+→)" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M12 5l7 7-7 7" />
        </svg>
      </button>
      <button id="reload" class="navbtn" title="刷新 (Ctrl+R)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36" />
          <path d="M21 3v6h-6" />
        </svg>
      </button>
      <div id="omnibox">
        <span id="secIcon"></span>
        <input id="address" placeholder="搜索或输入网址" spellcheck="false" autocomplete="off" />
        <button id="star" title="将此页添加到收藏夹 (Ctrl+D)" disabled>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round">
            <path d="M12 3.6l2.5 5.2 5.7.8-4.1 4 1 5.7-5.1-2.7-5.1 2.7 1-5.7-4.1-4 5.7-.8z" />
          </svg>
        </button>
      </div>
      <div id="busy"><span class="dot"></span>Agent 操作中</div>
      <button id="favBtn" class="navbtn" title="收藏夹 (Ctrl+Shift+O)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6.5 4.2l1.15 2.33 2.57.37-1.86 1.82.44 2.56-2.3-1.2-2.3 1.2.44-2.56-1.86-1.82 2.57-.37z" />
          <path d="M13 7h8M13 12h8M13 17h8" />
        </svg>
      </button>
      <button id="histBtn" class="navbtn" title="历史记录 (Ctrl+H)">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 2.64-6.36M3 4v4h4" />
          <path d="M12 7v5l3.5 2" />
        </svg>
      </button>
      <button id="menuBtn" class="navbtn" title="设置及更多">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="5" cy="12" r="1.8" />
          <circle cx="12" cy="12" r="1.8" />
          <circle cx="19" cy="12" r="1.8" />
        </svg>
      </button>
    </nav>
    <aside id="panel" hidden>
      <div id="panelHead">
        <span id="panelTitle"></span>
        <button id="panelClose" class="navbtn" title="关闭">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18" />
          </svg>
        </button>
      </div>
      <div id="panelBody"></div>
    </aside>
    <script src="renderer.js"></script>
  </body>
</html>
